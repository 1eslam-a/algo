<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="first.css">
</head>
<body class="light-mode">
    <div class="animated-background">
        <div class="particles-container"></div>
        <div class="floating-shapes"></div>
    </div>

    <div class="theme-switcher">
        <i class="fas fa-moon"></i>
        <label class="switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider round"></span>
        </label>
        <i class="fas fa-sun"></i>
    </div>

    <div class="container">
        <header>
            <h1 class="title">Algorithm <span>Visualizer</span></h1>
            <p class="subtitle">Explore search algorithms interactively</p>
        </header>

        <div class="control-panel">
            <div class="input-group">
                <label for="arrayInput">
                    <i class="fas fa-list-ol"></i> Enter numbers (comma separated)
                </label>
                <input type="text" id="arrayInput" placeholder="e.g. 5, 3, 8, 1, 9, 4">
            </div>
            
            <div class="input-group">
                <label for="searchValue">
                    <i class="fas fa-search"></i> Number to search
                </label>
                <input type="number" id="searchValue" placeholder="Enter target number">
            </div>
            
            <div class="buttons">
                <button id="linearSearchBtn" class="btn-linear">
                    <i class="fas fa-arrow-right"></i> Linear Search
                </button>
                <button id="binarySearchBtn" class="btn-binary">
                    <i class="fas fa-divide"></i> Binary Search
                </button>
                <button id="resetBtn" class="btn-reset">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>
        
        <div class="visualization-area">
            <div id="arrayContainer" class="array-container"></div>
            <div id="resultDisplay" class="result-display"></div>
        </div>
    </div>

    <div class="algorithm-explanation" id="algorithmExplanation">
        <div class="explanation-content">
          <button class="close-btn" id="closeExplanation">&times;</button>
          <h3 id="explanationTitle">Algorithm Explanation</h3>
          <div class="explanation-text" id="explanationText"></div>
        </div>
      </div>
      

      <audio id="myAudio" autoplay loop>
        <source src="Relaxing Piano Music_ Romantic Music, Beautiful Relaxing Music, Sleep Music, Stress Relief ★122.mp3" type="audio/mpeg">
      </audio>

    <script src="first.js"></script>
</body>
</html>
